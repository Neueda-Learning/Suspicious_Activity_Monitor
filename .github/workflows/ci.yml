name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: aml
          POSTGRES_USER: aml
          POSTGRES_PASSWORD: aml
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aml -d aml"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/aml
      SPRING_DATASOURCE_USERNAME: aml
      SPRING_DATASOURCE_PASSWORD: aml

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build and test
        run: mvn -B -ntp verify