<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Rule Stats — AML Alert Triage</title>
  <link rel="stylesheet" href="assets/theme.css" />
</head>
<body>
  <div id="shell"></div>

  <main class="canvas narrow">
    <div class="page-head">
      <div>
        <div class="eyebrow"><span class="label-cap">Model performance</span></div>
        <h1>Rule Stats</h1>
        <p>How often each rule fires, and where the cases it raises end up.</p>
      </div>
    </div>

    <div class="cols" style="grid-template-columns:1fr 1fr">
      <section class="card">
        <div class="card-head">
          <div class="title-wrap"><h2>Rule trigger counts</h2>
            <span class="tiny muted-2" id="ruleTotal"></span></div>
        </div>
        <div class="card-body"><div class="hbar" id="rulesChart"></div></div>
      </section>

      <section class="card">
        <div class="card-head">
          <div class="title-wrap"><h2>Disposition distribution</h2>
            <span class="tiny muted-2" id="dispTotal"></span></div>
        </div>
        <div class="card-body">
          <div class="donut-wrap">
            <div class="donut" id="donut">
              <svg viewBox="0 0 120 120" id="donutSvg"></svg>
              <div class="mid"><div class="n" id="donutNum">0</div><div class="label-cap">Cases</div></div>
            </div>
            <div class="legend" id="dispLegend"></div>
          </div>
        </div>
      </section>
    </div>
  </main>

  <div id="footer"></div>

  <script src="assets/ui.js"></script>
  <script src="assets/mock-data.js"></script>
  <script>
    mountShell({ active: 'queue', sub: 'Rule Stats' },
      'The system does not determine guilt. It identifies unusual activity and provides investigators with explainable evidence.');

    const SLICE_COLORS = ['var(--green-dot)', 'var(--blue-dot)', 'var(--amber-dot)', 'var(--red-dot)'];

    function renderRules(rules) {
      const entries = Object.entries(rules).sort((a, b) => b[1] - a[1]);
      const max = Math.max(...entries.map(e => e[1]), 1);
      const total = entries.reduce((s, e) => s + e[1], 0);
      document.getElementById('ruleTotal').textContent = `${total} triggers`;

      document.getElementById('rulesChart').innerHTML = entries.map(([code, n], i) => `
        <div class="hbar-row rise" style="animation-delay:${i * 70}ms">
          <div class="lbl">
            <span class="rule-tag">${esc(code)}</span>
            <span>${esc(RULE_NAMES[code] || code)}</span>
          </div>
          <div class="track"><span data-w="${Math.round(n / max * 100)}%"></span></div>
          <div class="val">${n}</div>
        </div>`).join('');

      paintBars(document.getElementById('rulesChart'));
    }

    function renderDispositions(disp) {
      const entries = Object.entries(disp).sort((a, b) => b[1] - a[1]);
      const total = entries.reduce((s, e) => s + e[1], 0);
      document.getElementById('dispTotal').textContent = `${total} cases`;

      const r = 49, circ = 2 * Math.PI * r;
      let offset = 0;

      document.getElementById('donutSvg').innerHTML = entries.map(([, n], i) => {
        const len = n / total * circ;
        const el = `<circle cx="60" cy="60" r="${r}" stroke="${SLICE_COLORS[i % SLICE_COLORS.length]}"
          stroke-dasharray="0 ${circ}" stroke-dashoffset="${-offset}" data-len="${len}" data-circ="${circ}"/>`;
        offset += len;
        return el;
      }).join('');

      // Grow each arc from zero on the next frame so the transition actually runs.
      requestAnimationFrame(() => {
        document.querySelectorAll('#donutSvg circle').forEach((c, i) => {
          setTimeout(() => {
            c.style.strokeDasharray = `${c.dataset.len} ${c.dataset.circ}`;
          }, i * 110);
        });
      });

      countUp(document.getElementById('donutNum'), total, 900);

      document.getElementById('dispLegend').innerHTML = entries.map(([k, n], i) => `
        <div class="legend-row rise" style="animation-delay:${i * 70}ms">
          <i style="background:${SLICE_COLORS[i % SLICE_COLORS.length]}"></i>
          <span>${esc(DISPOSITION_LABELS[k] || k)}</span>
          <span class="n">${n}</span>
          <span class="p">${(n / total * 100).toFixed(0)}%</span>
        </div>`).join('');
    }

    (async function load() {
      document.getElementById('rulesChart').innerHTML = Array.from({ length: 4 }, () =>
        '<div class="sk" style="height:22px;margin-bottom:.7rem"></div>').join('');

      const data = await mockFetch(MOCK.stats, 450);
      renderRules(data.ruleTriggers || {});
      renderDispositions(data.dispositionDistribution || {});
    })();
  </script>
</body>
</html>
