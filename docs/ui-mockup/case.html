<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Case Detail — AML Alert Triage</title>
  <link rel="stylesheet" href="assets/theme.css" />
</head>
<body>
  <div id="shell"></div>
  <main class="canvas" id="app"></main>
  <div id="footer"></div>

  <script src="assets/ui.js"></script>
  <script src="assets/mock-data.js"></script>
  <script>
    mountShell({ active: 'queue', sub: 'Case Detail' },
      'The system does not determine guilt. It identifies unusual activity and provides investigators with explainable evidence.');

    let d = null;
    let currentDraft = null;
    let draftJson = null;
    let editingNarrative = false;
    let evidenceIndex = {};

    const bandColor = b => `var(--${String(b).toLowerCase()}-dot)`;

    /* =====================================================================
       Evidence rows — one branch per rule, same as the current case.html
       ===================================================================== */
    function evidenceRows(a) {
      const ev = a.evidenceSnapshot || {};
      const rows = [];

      if (a.ruleCode === 'R1') {
        rows.push(['Inbound in this 24h window', fmtMoney(ev.windowInboundGbp)]);
        rows.push(['90-day median daily inbound',
          fmtMoney(ev.baselineMedianGbp) +
          (ev.baselineInboundTxnCount != null
            ? `  (${ev.baselineInboundTxnCount} inbound transactions / ${ev.baselineActiveDays} active days)` : '')]);
        rows.push(['Ratio', ev.ratio != null ? `${Number(ev.ratio).toFixed(2)}×` : '—']);
      } else if (a.ruleCode === 'R2') {
        rows.push(['Window inbound', fmtMoney(ev.inboundGbp)]);
        rows.push(['Outbound within 24h', fmtMoney(ev.outboundGbp)]);
        rows.push(['Dispersal ratio', ev.dispersalRatio != null ? `${Number(ev.dispersalRatio).toFixed(2)}×` : '—']);
        rows.push(['Counterparties', ev.counterpartyCount != null ? String(ev.counterpartyCount) : '—']);
        rows.push(['Time to disperse', ev.hoursToDisperse != null ? `${Number(ev.hoursToDisperse).toFixed(1)} h` : '—']);
      } else if (a.ruleCode === 'R3') {
        rows.push(['New counterparties', ev.newCount != null ? String(ev.newCount) : '—']);
        if (Array.isArray(ev.newCounterparties) && ev.newCounterparties.length) {
          rows.push(['Counterparty references', ev.newCounterparties.join(', ')]);
        }
      } else if (a.ruleCode === 'R4') {
        rows.push(['Outbound to higher-risk jurisdictions', fmtMoney(ev.valueToHighRisk)]);
        rows.push(['Total window outbound', fmtMoney(ev.totalOutbound)]);
        rows.push(['Higher-risk transfers', ev.highRiskTransferCount != null ? String(ev.highRiskTransferCount) : '—']);
        if (Array.isArray(ev.highRiskCountries) && ev.highRiskCountries.length) {
          rows.push(['Countries involved',
            ev.highRiskCountries.map(c => `${flag(c)} ${c}`).join(', ')]);
        }
      } else {
        Object.keys(ev).forEach(k => {
          if (k === 'transactionIds') return;
          const v = ev[k];
          if (v != null && typeof v === 'object') return;
          rows.push([k, String(v)]);
        });
      }

      const weight = (a.ruleParamsSnapshot || {}).weight ?? '—';
      const body = rows.map(([k, v]) =>
        `<div class="evidence-row"><dt>${esc(k)}</dt><dd>${esc(v)}</dd></div>`).join('');

      // The score line is the whole point of the panel — give it its own treatment.
      const math = `<span class="score-math">
          <span>strength <b class="num">${a.strength}</b></span>
          <span class="op">×</span>
          <span>weight <b class="num">${weight}</b></span>
          <span class="op">=</span>
          <span><b class="num">${a.points}</b> points</span>
        </span>`;

      return `<dl style="margin:0">${body}
        <div class="evidence-row total"><dt>Score</dt><dd>${math}</dd></div></dl>`;
    }

    /* =====================================================================
       Score breakdown
       ===================================================================== */
    function renderAlerts(alerts, total) {
      if (!alerts.length) return '<p class="muted">No alerts</p>';
      return `<div class="alert-list">${alerts.map((a, i) => `
        <div class="alert-item rise" style="animation-delay:${i * 60}ms"
             data-alert-id="${a.id}" data-alert-ref="${esc(a.ruleCode)}-ALERT-${a.id}">
          <button class="alert-head" type="button" aria-expanded="false">
            <span class="rule-tag">${esc(a.ruleCode)}</span>
            <span class="alert-name">
              <span class="n">${esc(a.ruleName)}</span>
              <span class="s"> · strength ${a.strength}</span>
            </span>
            <span class="alert-points">
              <span class="contrib" title="Share of the case score">
                <span data-w="${Math.round(a.points / total * 100)}%"></span>
              </span>
              <span class="pts num">${a.points}<small>pts</small></span>
            </span>
            <span class="alert-caret">${ico('chevron')}</span>
          </button>
          <div class="alert-body"><div class="inner"><div class="pad">${evidenceRows(a)}</div></div></div>
        </div>`).join('')}</div>`;
    }

    /* =====================================================================
       AI draft
       ===================================================================== */
    function parseDraftPayload(text) {
      if (!text || !String(text).trim()) return null;
      try {
        const obj = JSON.parse(text);
        if (!obj || typeof obj !== 'object' || Array.isArray(obj)) return null;
        if (!('narrative' in obj) && !('confirmedObservations' in obj)
            && !('unexplainedQuestions' in obj) && !('suggestedNextChecks' in obj)) return null;
        return obj;
      } catch { return null; }
    }

    const sourceText = draft => draft ? (draft.analystFinalText || draft.rawOutput || '') : '';

    function buildEvidenceIndex() {
      evidenceIndex = {};
      document.querySelectorAll('[data-txn-ref]').forEach(el => {
        evidenceIndex[el.getAttribute('data-txn-ref')] = el;
      });
      document.querySelectorAll('[data-alert-id]').forEach(el => {
        const aid = el.getAttribute('data-alert-id');
        const aref = el.getAttribute('data-alert-ref');
        if (aid) evidenceIndex[aid] = el;
        if (aref) evidenceIndex[aref] = el;
      });
    }

    function renderChip(evidenceId) {
      const hit = evidenceIndex[evidenceId];
      return hit
        ? `<button type="button" class="chip" data-jump="${esc(evidenceId)}">${ico('link')}${esc(evidenceId)}</button>`
        : `<span class="chip unverified" title="Not found in this case">${esc(evidenceId)} · unverified</span>`;
    }

    function renderStructuredDraft(obj, draft) {
      const parts = [];
      const accepted = draft && draft.status === 'ACCEPTED' && draft.editedBy;
      parts.push(`<p class="draft-accepted" id="draftAccepted"${accepted ? '' : ' hidden'}>
        ${ico('checkC')}<span>${accepted
          ? `Edited and accepted by ${esc(draft.editedBy)}${draft.editedAt ? ` · ${esc(fmtTs(draft.editedAt))}` : ''}`
          : ''}</span></p>`);

      if (obj.narrative) {
        parts.push(`
          <div class="draft-block">
            <div class="draft-block-head">
              <span class="label-cap">Narrative</span>
              <button type="button" class="btn ghost sm" id="editNarrative">Edit</button>
            </div>
            <p class="draft-narrative-text" id="narrativeView">${esc(obj.narrative)}</p>
            <textarea class="draft-narrative-edit" id="narrativeEdit" hidden></textarea>
          </div>`);
      }

      const obs = Array.isArray(obj.confirmedObservations) ? obj.confirmedObservations : [];
      if (obs.length) {
        parts.push(`
          <div class="draft-block">
            <div class="draft-block-head"><span class="label-cap">Confirmed observations</span>
              <span class="tiny muted-2">Click a reference to jump to it</span></div>
            <ul class="draft-list">${obs.map(o => `
              <li>
                <span class="draft-bullet">${ico('check')}</span>
                <div>
                  <div>${esc(o.statement || '')}</div>
                  ${(Array.isArray(o.evidenceIds) && o.evidenceIds.length)
                    ? `<div class="chip-row">${o.evidenceIds.map(renderChip).join('')}</div>` : ''}
                </div>
              </li>`).join('')}</ul>
          </div>`);
      }

      const qs = Array.isArray(obj.unexplainedQuestions) ? obj.unexplainedQuestions : [];
      if (qs.length) {
        parts.push(`
          <div class="draft-block draft-questions">
            <div class="draft-block-head"><span class="label-cap">Unexplained questions</span></div>
            <ul class="draft-list">${qs.map(q =>
              `<li><span class="draft-bullet">?</span><div>${esc(q)}</div></li>`).join('')}</ul>
          </div>`);
      }

      const checks = Array.isArray(obj.suggestedNextChecks) ? obj.suggestedNextChecks : [];
      if (checks.length) {
        parts.push(`
          <div class="draft-block draft-checks">
            <div class="draft-block-head"><span class="label-cap">Suggested next checks</span></div>
            <ul class="draft-list">${checks.map(c =>
              `<li><span class="draft-bullet">→</span><div>${esc(c)}</div></li>`).join('')}</ul>
          </div>`);
      }

      const fallbackUsed = Boolean(draft && draft.modelMetadataJson && draft.modelMetadataJson.fallbackUsed);
      parts.push(`<p class="disclaimer"><b>${fallbackUsed
        ? 'Offline template fallback — evidence-grounded, but not model-generated.'
        : 'AI-generated draft — not a conclusion.'}</b>
        The analyst is accountable for the final assessment.</p>`);

      return `<div class="draft reveal">${parts.join('')}</div>`;
    }

    function renderEmptyDraft() {
      return `<div class="empty-state" id="aiEmpty">
        ${ico('doc')}
        <div class="t">No draft yet</div>
        <div class="tiny">Generate a draft to turn the evidence above into a written starting point.</div>
      </div>`;
    }

    function setProvenance(draft) {
      const el = document.getElementById('aiMeta');
      if (!el) return;
      if (!draft) { el.textContent = ''; return; }
      const meta = draft.modelMetadataJson || {};
      const ms = meta.elapsedMs != null ? ` · ${meta.elapsedMs}ms` : '';
      const fallback = meta.fallbackUsed ? ' · template fallback' : '';
      el.textContent = `Draft #${draft.id} · model=${meta.model || '—'}${fallback}${ms}`;
    }

    function paintDraftView() {
      const view = document.getElementById('aiDraftView');
      if (!view) return;
      editingNarrative = false;

      if (!currentDraft) {
        draftJson = null;
        view.innerHTML = renderEmptyDraft();
        document.getElementById('acceptAi').disabled = true;
        setProvenance(null);
        return;
      }

      const text = sourceText(currentDraft);
      draftJson = parseDraftPayload(text);
      setProvenance(currentDraft);

      if (!draftJson) {
        view.innerHTML = `<div class="draft-raw-fallback">
          <p class="disclaimer"><b>Structured view unavailable</b> — showing raw model output</p>
          <pre class="code">${esc(text)}</pre></div>`;
        document.getElementById('acceptAi').disabled = true;
        return;
      }

      view.innerHTML = renderStructuredDraft(draftJson, currentDraft);
      document.getElementById('acceptAi').disabled = currentDraft.status === 'ACCEPTED';
      wireDraftInteractions();
    }

    function currentNarrativeText() {
      if (editingNarrative) {
        const ta = document.getElementById('narrativeEdit');
        return ta ? ta.value : (draftJson && draftJson.narrative) || '';
      }
      return (draftJson && draftJson.narrative) || '';
    }

    function wireDraftInteractions() {
      const editBtn = document.getElementById('editNarrative');
      if (editBtn) {
        editBtn.onclick = () => {
          const view = document.getElementById('narrativeView');
          const ta = document.getElementById('narrativeEdit');
          if (!view || !ta) return;
          if (!editingNarrative) {
            ta.value = draftJson.narrative || '';
            ta.hidden = false; view.hidden = true;
            editingNarrative = true;
            editBtn.textContent = 'Done';
            editBtn.classList.remove('ghost'); editBtn.classList.add('subtle');
            ta.focus();
            ta.style.height = 'auto';
            ta.style.height = Math.max(view.offsetHeight, ta.scrollHeight) + 'px';
          } else {
            draftJson.narrative = ta.value;
            view.textContent = ta.value;
            ta.hidden = true; view.hidden = false;
            editingNarrative = false;
            editBtn.textContent = 'Edit';
            editBtn.classList.add('ghost'); editBtn.classList.remove('subtle');
          }
        };
      }
      document.querySelectorAll('.chip[data-jump]').forEach(btn => {
        btn.onclick = () => {
          const target = evidenceIndex[btn.getAttribute('data-jump')];
          if (target && target.classList.contains('alert-item')) openAlert(target);
          flashTarget(target);
        };
      });
    }

    function openAlert(item) {
      item.classList.add('open');
      item.querySelector('.alert-head')?.setAttribute('aria-expanded', 'true');
    }

    /* =====================================================================
       Audit trail
       ===================================================================== */
    const KEY_ACTIONS = new Set(['CASE_OPENED', 'CASE_DISPOSED', 'CASE_ESCALATED',
                                 'PAYMENT_HELD', 'AI_DRAFT_EDITED_AND_ACCEPTED']);

    function renderAudit(events) {
      return `<div class="audit">${(events || []).map(a => `
        <div class="audit-item ${KEY_ACTIONS.has(a.action) ? 'is-key' : ''}">
          <div class="audit-top">
            <span class="audit-action">${esc(a.action)}</span>
            <span class="pill">${esc(a.actor)}</span>
            <span class="audit-meta">${esc(fmtTs(a.occurredAt))}</span>
          </div>
          <div class="audit-details">${Object.entries(a.detailsJson || {}).map(([k, v]) =>
            `<span class="kvchip"><b>${esc(k)}</b> ${esc(v)}</span>`).join('')}</div>
        </div>`).join('')}</div>`;
    }

    /* =====================================================================
       Page
       ===================================================================== */
    function render() {
      const c = d.caseRecord;
      const cust = d.customer;
      const focus = d.focusTxnRef;
      const total = d.alerts.reduce((s, a) => s + a.points, 0);
      const sla = fmtRelative(c.slaDueAt);
      const circ = 2 * Math.PI * 34;

      document.getElementById('app').innerHTML = `
        <div class="crumbs" style="margin-bottom:.75rem">
          <a href="index.html">Case Queue</a>${ico('chevron')}<span class="mono">${esc(c.caseRef)}</span>
        </div>

        <div class="hero" style="--band-color:${bandColor(c.priorityBand)}">
          <div>
            <div class="hero-id">
              <h1>${esc(c.caseRef)}</h1>
              <span class="band ${c.priorityBand}"><i></i>${esc(bandLabel(c.priorityBand))}</span>
              <span class="pill ${c.status === 'OPEN' ? 'info' : 'ok'}">${esc(c.status)}</span>
              ${cust.monitoringStatus === 'PENDING_REVIEW'
                ? '<span class="pill notice">MONITORING: PENDING REVIEW</span>' : ''}
            </div>
            <div class="hero-sub">
              <strong>${esc(cust.name)}</strong>
              <span class="mono muted-2">${esc(cust.customerRef)}</span>
              <span class="muted-2">·</span>
              <span>${flag(cust.incorporationCountry)} ${esc(cust.incorporationCountryName || cust.incorporationCountry)}</span>
              <span class="muted-2">·</span>
              <span>CRR ${esc(cust.crr)}</span>
              <span class="muted-2">·</span>
              <span>${esc(cust.industry)}</span>
            </div>
          </div>
          <div class="hero-side">
            <div class="hero-facts">
              <div class="hero-fact">
                <span class="label-cap">SLA deadline</span>
                <span class="v" style="${sla.tone === 'over' ? 'color:var(--red-fg)' : sla.tone === 'soon' ? 'color:var(--amber-fg)' : ''}">
                  ${esc(sla.text)}</span>
              </div>
              <div class="hero-fact">
                <span class="label-cap">Assignee</span>
                <span class="v">${c.assignedTo
                  ? `<span class="assignee"><span class="avatar">${esc(initials(c.assignedTo))}</span><span class="mono">${esc(c.assignedTo)}</span></span>`
                  : '—'}</span>
              </div>
            </div>
            <div class="dial">
              <svg viewBox="0 0 80 80">
                <circle class="track" cx="40" cy="40" r="34"/>
                <circle class="fill" cx="40" cy="40" r="34"
                        stroke-dasharray="${circ}" stroke-dashoffset="${circ}" id="dialFill"/>
              </svg>
              <div class="dial-txt">
                <div class="dial-num" id="dialNum">0</div>
                <div class="dial-cap">Score</div>
              </div>
            </div>
          </div>
        </div>

        <div class="cols">
          <div class="stack">

            <section class="card" id="s-score">
              <div class="card-head">
                <div class="title-wrap">
                  <h2>${ico('scale')} Score breakdown</h2>
                  <span class="tiny muted-2">${d.alerts.length} rules contributed ${total} points</span>
                </div>
                <button class="btn ghost sm" type="button" id="toggleAll">Expand all</button>
              </div>
              <div class="card-body">${renderAlerts(d.alerts, total)}</div>
            </section>

            <section class="card" id="s-timeline">
              <div class="card-head">
                <div class="title-wrap">
                  <h2>${ico('clock')} Transaction timeline</h2>
                  <span class="tiny muted-2">${fmtShort(c.windowStart)} → ${fmtShort(c.windowEnd)} UTC</span>
                </div>
                ${focus ? `<span class="pill notice">Focus ${esc(focus)}</span>` : ''}
              </div>
              <div class="table-wrap">
                <table class="data">
                  <thead><tr>
                    <th>When</th><th>Reference</th><th>Direction</th>
                    <th class="right">Amount</th><th>Counterparty</th><th>Status</th>
                  </tr></thead>
                  <tbody>
                    ${d.timeline.map(t => `
                      <tr data-txn-ref="${esc(t.txnRef)}"${t.txnRef === focus ? ' class="focus-txn"' : ''}>
                        <td class="num" style="white-space:nowrap">${esc(fmtShort(t.executedAt))}</td>
                        <td>
                          <span class="mono">${esc(t.txnRef)}</span>
                          ${t.txnRef === focus ? '<span class="pill notice" style="margin-left:.35rem">FOCUS</span>' : ''}
                        </td>
                        <td><span class="dir ${esc(t.direction)}">
                          ${ico(t.direction === 'INBOUND' ? 'arrowDn' : 'arrowUp')}${esc(t.direction)}</span></td>
                        <td class="right num" style="font-weight:600">${esc(fmtMoney(t.amountGbp))}</td>
                        <td>
                          <div>${esc(t.counterpartyName || '')}</div>
                          <div class="sub-line">${flag(t.counterpartyCountry)} ${esc(t.counterpartyCountry || '')}</div>
                        </td>
                        <td><span class="pill ok">${esc(t.status || '')}</span></td>
                      </tr>`).join('')}
                  </tbody>
                </table>
              </div>
            </section>

            <section class="card" id="s-draft">
              <div class="card-head">
                <div class="title-wrap">
                  <h2>${ico('spark')} Investigation draft</h2>
                  <span class="provenance" id="aiMeta"></span>
                </div>
                <div class="actions">
                  <button class="btn secondary sm" id="genAi" type="button">Generate draft</button>
                  <button class="btn sm" id="acceptAi" type="button" disabled>Accept</button>
                </div>
              </div>
              <div class="card-body">
                <p class="tiny muted">AI never changes scores, CRR, or case status. The analyst remains accountable.</p>
                <p class="ai-progress" id="aiProgress" role="status" aria-live="polite" hidden></p>
                <div id="aiDraftView" style="margin-top:.75rem"></div>
              </div>
            </section>

            <section class="card" id="s-disposition">
              <div class="card-head"><h2>${ico('lock')} Disposition</h2></div>
              <div class="card-body stack" style="gap:.9rem">
                <div class="field">
                  <label>Decision</label>
                  <div class="choice-grid" id="decisionGroup">
                    <label class="choice">
                      <input type="radio" name="decision" value="CLOSED_NFA" checked />
                      <span class="ct"><span class="dotmark"></span>No Further Action</span>
                      <span class="cd">Activity reviewed and explained.</span>
                    </label>
                    <label class="choice">
                      <input type="radio" name="decision" value="CLOSED_FALSE_POSITIVE" />
                      <span class="ct"><span class="dotmark"></span>False Positive</span>
                      <span class="cd">Rules fired on benign behaviour.</span>
                    </label>
                    <label class="choice">
                      <input type="radio" name="decision" value="ESCALATED_INTERNAL" />
                      <span class="ct"><span class="dotmark"></span>Escalate Internally</span>
                      <span class="cd">Refer to the next line for review.</span>
                    </label>
                  </div>
                </div>
                <div class="field">
                  <label for="rationale">Rationale <span class="muted-2">(required)</span></label>
                  <textarea id="rationale" placeholder="Document the investigative rationale…"></textarea>
                  <div class="actions">
                    <span class="hint">Stored on the audit trail against your user.</span>
                    <span class="char-count" id="charCount">0 characters</span>
                  </div>
                </div>
                <div class="actions">
                  <button class="btn" id="disposeBtn" type="button" ${c.status !== 'OPEN' ? 'disabled' : ''}>
                    ${ico('check')} Submit disposition</button>
                  <span class="hint" id="dispMsg">${c.status !== 'OPEN' ? 'Case already disposed: ' + esc(c.status) : ''}</span>
                </div>
              </div>
            </section>

            <section class="card" id="s-audit">
              <div class="card-head">
                <div class="title-wrap">
                  <h2>${ico('doc')} Audit trail</h2>
                  <span class="tiny muted-2" id="auditCount">${d.auditEvents.length} events</span>
                </div>
              </div>
              <div class="card-body" id="auditBody">${renderAudit(d.auditEvents)}</div>
            </section>
          </div>

          <aside class="aside">
            <div class="card">
              <nav class="secnav">
                <a href="#s-score" class="current">Score breakdown <span class="n">${d.alerts.length}</span></a>
                <a href="#s-timeline">Transaction timeline <span class="n">${d.timeline.length}</span></a>
                <a href="#s-draft">Investigation draft</a>
                <a href="#s-disposition">Disposition</a>
                <a href="#s-audit">Audit trail <span class="n">${d.auditEvents.length}</span></a>
              </nav>
            </div>

            <div class="card">
              <div class="card-head"><h2>Case facts</h2></div>
              <div class="card-body">
                <dl class="kv">
                  <div><dt>Status</dt><dd>${esc(c.status)}</dd></div>
                  <div><dt>SLA due</dt><dd>${esc(fmtShort(c.slaDueAt))}</dd></div>
                  <div><dt>Window</dt><dd>${esc(fmtShort(c.windowStart))} → ${esc(fmtShort(c.windowEnd))}</dd></div>
                  <div><dt>Prior closed 90d</dt><dd>${c.priorRecentCases}</dd></div>
                  <div><dt>CRR review</dt><dd>${c.crrReviewRequired ? 'Required' : 'No'}</dd></div>
                  <div><dt>Opened</dt><dd>${esc(c.openedBy || 'Monitoring run')}<div class="sub-line">${esc(fmtShort(c.openedAt))}</div></dd></div>
                </dl>
              </div>
            </div>

            <div class="card">
              <div class="card-head"><h2>Customer</h2></div>
              <div class="card-body">
                <dl class="kv">
                  <div><dt>Name</dt><dd><strong>${esc(cust.name)}</strong></dd></div>
                  <div><dt>Reference</dt><dd class="mono">${esc(cust.customerRef)}</dd></div>
                  <div><dt>CRR</dt><dd>${esc(cust.crr)}</dd></div>
                  <div><dt>Industry</dt><dd>${esc(cust.industry)}<div class="sub-line">${esc(cust.legalForm)}</div></dd></div>
                  <div><dt>Country</dt><dd>${flag(cust.incorporationCountry)} ${esc(cust.incorporationCountryName)}</dd></div>
                  <div><dt>Monitoring</dt><dd>${cust.monitoringStatus === 'PENDING_REVIEW'
                    ? `<span class="pill notice">${esc(cust.monitoringStatus)}</span>`
                    : `<span class="pill">${esc(cust.monitoringStatus)}</span>`}</dd></div>
                </dl>
              </div>
            </div>
          </aside>
        </div>`;

      /* ---- post-render wiring ---- */
      buildEvidenceIndex();
      paintBars();

      // Dial + score animation
      const pct = Math.min(100, c.priorityScore) / 100;
      requestAnimationFrame(() => {
        document.getElementById('dialFill').style.strokeDashoffset = String(circ * (1 - pct));
      });
      countUp(document.getElementById('dialNum'), c.priorityScore, 1100);

      wireAlerts();
      wireDisposition();
      wireDraftPanel();
      scrollSpy('.secnav a', 'section.card[id^="s-"]');

      currentDraft = d.aiDraft || null;
      paintDraftView();
    }

    function wireAlerts() {
      document.querySelectorAll('.alert-item').forEach(item => {
        const head = item.querySelector('.alert-head');
        head.onclick = () => {
          const open = item.classList.toggle('open');
          head.setAttribute('aria-expanded', String(open));
        };
      });
      const toggle = document.getElementById('toggleAll');
      toggle.onclick = () => {
        const items = [...document.querySelectorAll('.alert-item')];
        const expand = !items.every(i => i.classList.contains('open'));
        items.forEach(i => {
          i.classList.toggle('open', expand);
          i.querySelector('.alert-head').setAttribute('aria-expanded', String(expand));
        });
        toggle.textContent = expand ? 'Collapse all' : 'Expand all';
      };
    }

    function wireDisposition() {
      const ta = document.getElementById('rationale');
      const count = document.getElementById('charCount');
      ta.oninput = () => { count.textContent = `${ta.value.length} characters`; };

      document.getElementById('disposeBtn').onclick = async e => {
        const btn = e.currentTarget;
        const decision = document.querySelector('input[name="decision"]:checked').value;
        if (!ta.value.trim()) {
          document.getElementById('dispMsg').innerHTML =
            '<span style="color:var(--red-fg);font-weight:600">Rationale is required.</span>';
          ta.focus();
          return;
        }
        btn.classList.add('is-loading'); btn.disabled = true;
        await mockFetch(null, 700);
        btn.classList.remove('is-loading'); btn.disabled = false;
        toast(`Disposition recorded — ${DISPOSITION_LABELS[decision]}`);
        document.getElementById('dispMsg').textContent = 'Mockup only — no request was sent.';
      };
    }

    function wireDraftPanel() {
      document.getElementById('genAi').onclick = async () => {
        const genAi = document.getElementById('genAi');
        const acceptAi = document.getElementById('acceptAi');
        const progress = document.getElementById('aiProgress');
        const original = genAi.textContent;
        const timers = [];
        const setProgress = m => { progress.textContent = m; progress.hidden = false; };

        genAi.disabled = true; genAi.classList.add('is-loading'); genAi.textContent = 'Generating…';
        acceptAi.disabled = true;
        setProgress('Collecting case evidence…');
        timers.push(setTimeout(() => setProgress('Generating draft with the configured model…'), 500));
        timers.push(setTimeout(() => setProgress('Validating structure and evidence citations…'), 1350));

        currentDraft = await mockFetch(MOCK.aiDraftResponse, 2100);
        paintDraftView();

        timers.forEach(clearTimeout);
        progress.hidden = true;
        genAi.classList.remove('is-loading'); genAi.textContent = original; genAi.disabled = false;
        acceptAi.disabled = currentDraft.status === 'ACCEPTED' || !draftJson;
        toast('Draft generated');
      };

      document.getElementById('acceptAi').onclick = async e => {
        if (!currentDraft || !draftJson) return;
        const btn = e.currentTarget;
        btn.classList.add('is-loading'); btn.disabled = true;
        const next = { ...draftJson, narrative: currentNarrativeText() };
        draftJson = next;
        await mockFetch(null, 600);
        currentDraft = {
          ...currentDraft, status: 'ACCEPTED',
          editedBy: 's.whitfield', editedAt: new Date().toISOString(),
          analystFinalText: JSON.stringify(next)
        };
        paintDraftView();
        btn.classList.remove('is-loading');
        document.getElementById('acceptAi').disabled = true;

        // Audit trail gains the accept event, as it does in the real app.
        d.auditEvents = [...d.auditEvents, {
          occurredAt: new Date().toISOString(), actor: 's.whitfield',
          action: 'AI_DRAFT_EDITED_AND_ACCEPTED', detailsJson: { draftId: currentDraft.id }
        }];
        document.getElementById('auditBody').innerHTML = renderAudit(d.auditEvents);
        document.getElementById('auditCount').textContent = `${d.auditEvents.length} events`;
        toast('Draft accepted and recorded');
      };
    }

    (async function load() {
      document.getElementById('app').innerHTML = `
        <div class="sk" style="height:96px;border-radius:var(--r-lg);margin-bottom:1.25rem"></div>
        <div class="cols">
          <div class="stack">
            <div class="sk" style="height:230px;border-radius:var(--r-lg)"></div>
            <div class="sk" style="height:300px;border-radius:var(--r-lg)"></div>
          </div>
          <div class="sk" style="height:180px;border-radius:var(--r-lg)"></div>
        </div>`;
      d = await mockFetch(MOCK.caseDetail, 480);
      render();
    })();
  </script>
</body>
</html>
