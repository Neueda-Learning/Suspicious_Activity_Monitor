<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Case Queue — AML Alert Triage</title>
  <link rel="stylesheet" href="assets/theme.css" />
</head>
<body>
  <div id="shell"></div>

  <main class="canvas">
    <div class="page-head">
      <div>
        <div class="eyebrow"><span class="label-cap">Transaction monitoring</span></div>
        <h1>Case Queue</h1>
        <p>Open investigations ranked by priority score. The score sets the order; the evidence sets the decision.</p>
      </div>
      <div class="page-head-actions">
        <span class="result-count" id="stamp"></span>
        <button class="btn ghost" type="button" id="refreshBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
               stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 1 0-1.9 6"/><path d="M20 5v6h-6"/></svg>
          Refresh
        </button>
      </div>
    </div>

    <div class="metrics" id="metrics"></div>

    <div class="toolbar">
      <div class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
             stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input type="text" id="q" placeholder="Filter by case, customer or assignee…" autocomplete="off" />
        <kbd>/</kbd>
      </div>
      <div class="segmented" id="bandFilter" role="group" aria-label="Filter by priority band"></div>
      <div style="flex:1 1 auto"></div>
      <span class="result-count" id="count"></span>
      <div class="segmented" role="group" aria-label="Row density">
        <button type="button" data-density="comfortable" aria-pressed="true">Comfortable</button>
        <button type="button" data-density="compact" aria-pressed="false">Compact</button>
      </div>
    </div>

    <section class="card" style="border-radius:0 0 var(--r-lg) var(--r-lg)">
      <div class="table-wrap">
        <table class="data" id="table">
          <thead>
            <tr>
              <th class="sortable" data-key="caseRef">Case <span class="sort-ind">▼</span></th>
              <th class="sortable" data-key="customerName">Customer <span class="sort-ind">▼</span></th>
              <th class="sortable" data-key="priorityBand">Band <span class="sort-ind">▼</span></th>
              <th class="sortable score-col" data-key="priorityScore">Score <span class="sort-ind">▼</span></th>
              <th class="sortable alerts-col" data-key="alertCount">Alerts <span class="sort-ind">▼</span></th>
              <th class="sortable" data-key="slaDueAt">SLA deadline <span class="sort-ind">▼</span></th>
              <th class="sortable" data-key="assignedTo">Assignee <span class="sort-ind">▼</span></th>
              <th style="width:32px"></th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </section>
  </main>

  <div id="footer"></div>

  <script src="assets/ui.js"></script>
  <script src="assets/mock-data.js"></script>
  <script>
    mountShell({ active: 'queue', sub: 'Case Queue' },
      'The system does not determine guilt. It identifies unusual activity and provides investigators with explainable evidence.');

    let data = null;
    let sortKey = 'priorityScore';
    let sortDir = 'desc';
    let bandSel = 'ALL';
    let query = '';

    const BANDS = [
      { key: 'ALL',   label: 'All',          dot: null },
      { key: 'RED',   label: 'Red',          dot: 'var(--red-dot)' },
      { key: 'AMBER', label: 'Amber',        dot: 'var(--amber-dot)' },
      { key: 'GREEN', label: 'Low priority', dot: 'var(--green-dot)' }
    ];

    const bandColor = b => `var(--${b.toLowerCase()}-dot)`;

    /* ---------- skeleton while "loading" ---------- */
    function skeleton() {
      document.getElementById('metrics').innerHTML = Array.from({ length: 4 }, () => `
        <div class="metric">
          <div class="m-top"><div class="sk" style="width:70px;height:11px"></div><div class="sk" style="width:26px;height:26px;border-radius:6px"></div></div>
          <div class="sk" style="width:56px;height:30px;margin-top:.5rem"></div>
          <div class="sk" style="width:96px;height:10px;margin-top:.5rem"></div>
        </div>`).join('');
      document.getElementById('rows').innerHTML = Array.from({ length: 8 }, () => `
        <tr><td colspan="8" style="padding:.6rem .75rem"><div class="sk" style="height:20px"></div></td></tr>`).join('');
    }

    /* ---------- metrics ---------- */
    function renderMetrics(t) {
      const dueSoon = data.items.filter(c => {
        const d = new Date(c.slaDueAt) - Date.now();
        return d > 0 && d < 86400000;
      }).length;

      const tiles = [
        { label: 'Alerts',          value: t.alerts,       icon: 'bell',   note: `across ${t.cases} open cases` },
        { label: 'Open cases',      value: t.cases,        icon: 'folder', note: `${data.items.filter(c => c.priorityBand === 'RED').length} in the red band` },
        { label: 'Assigned to me',  value: t.assignedToMe, icon: 'user',   note: `${dueSoon} due within 24h` },
        { label: 'Overdue',         value: t.overdue,      icon: 'clock',  note: t.overdue ? 'past SLA deadline' : 'all within SLA', alert: t.overdue > 0 }
      ];

      document.getElementById('metrics').innerHTML = tiles.map((m, i) => `
        <div class="metric rise ${m.alert ? 'alert-state' : ''}" style="animation-delay:${i * 55}ms">
          <div class="m-top">
            <span class="label-cap">${m.label}</span>
            <span class="m-icon">${ico(m.icon)}</span>
          </div>
          <div class="m-value" data-count="${m.value}">0</div>
          <div class="m-note">${esc(m.note)}</div>
        </div>`).join('');

      document.querySelectorAll('[data-count]').forEach(el => countUp(el, Number(el.dataset.count)));
    }

    /* ---------- band filter ---------- */
    function renderBandFilter() {
      document.getElementById('bandFilter').innerHTML = BANDS.map(b => {
        const n = b.key === 'ALL' ? data.items.length : data.items.filter(c => c.priorityBand === b.key).length;
        return `<button type="button" data-band="${b.key}" aria-pressed="${bandSel === b.key}">
          ${b.dot ? `<i style="background:${b.dot}"></i>` : ''}${b.label}<span class="count">${n}</span>
        </button>`;
      }).join('');
      document.querySelectorAll('#bandFilter button').forEach(btn => {
        btn.onclick = () => { bandSel = btn.dataset.band; renderBandFilter(); renderRows(); };
      });
    }

    /* ---------- rows ---------- */
    function visibleItems() {
      const q = query.trim().toLowerCase();
      return data.items
        .filter(c => bandSel === 'ALL' || c.priorityBand === bandSel)
        .filter(c => !q || [c.caseRef, c.customerName, c.customerRef, c.assignedTo]
          .some(v => String(v || '').toLowerCase().includes(q)))
        .sort((a, b) => {
          const dir = sortDir === 'asc' ? 1 : -1;
          const av = a[sortKey], bv = b[sortKey];
          if (av == null) return 1;
          if (bv == null) return -1;
          if (typeof av === 'number') return (av - bv) * dir;
          return String(av).localeCompare(String(bv)) * dir;
        });
    }

    function renderRows() {
      const items = visibleItems();
      const tbody = document.getElementById('rows');

      document.getElementById('count').textContent =
        `${items.length} of ${data.items.length} cases`;

      if (!items.length) {
        tbody.innerHTML = `<tr><td colspan="8">
          <div class="empty-state" style="margin:.5rem">
            ${ico('search')}
            <div class="t">No cases match this filter</div>
            <div class="tiny">Clear the search box or pick a different band.</div>
          </div></td></tr>`;
        return;
      }

      tbody.innerHTML = items.map((c, i) => {
        const sla = fmtRelative(c.slaDueAt);
        const slaCls = sla.tone === 'over' ? 'style="color:var(--red-fg);font-weight:600"'
                     : sla.tone === 'soon' ? 'style="color:var(--amber-fg);font-weight:600"' : '';
        return `
        <tr class="row-link stagger" tabindex="0" data-id="${c.id}"
            style="--band-color:${bandColor(c.priorityBand)};animation-delay:${Math.min(i * 28, 340)}ms">
          <td>
            <div class="cell-primary mono">${esc(c.caseRef)}</div>
            ${c.overdue ? '<span class="pill warn" style="margin-top:.15rem">OVERDUE</span>' : ''}
          </td>
          <td>
            <div class="cell-primary">${esc(c.customerName || '')}</div>
            <div class="sub-line mono">${esc(c.customerRef || '')}</div>
          </td>
          <td><span class="band ${c.priorityBand}"><i></i>${esc(bandLabel(c.priorityBand))}</span></td>
          <td class="score-col">
            <div class="score-cell">
              <div class="score-bar"><span data-w="${c.priorityScore}%"></span></div>
              <b>${c.priorityScore}</b>
            </div>
          </td>
          <td class="alerts-col num">${c.alertCount}</td>
          <td>
            <div ${slaCls}>${esc(sla.text)}</div>
            <div class="sub-line num">${esc(fmtShort(c.slaDueAt))}</div>
          </td>
          <td>${c.assignedTo
            ? `<span class="assignee"><span class="avatar">${esc(initials(c.assignedTo))}</span><span class="mono">${esc(c.assignedTo)}</span></span>`
            : '<span class="pill">Unassigned</span>'}</td>
          <td class="right"><span class="go">${ico('chevron')}</span></td>
        </tr>`;
      }).join('');

      paintBars(tbody);

      tbody.querySelectorAll('tr.row-link').forEach(tr => {
        const open = () => { location.href = `case.html?id=${tr.dataset.id}`; };
        tr.onclick = open;
        tr.onkeydown = e => {
          if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(); }
          if (e.key === 'ArrowDown') { e.preventDefault(); tr.nextElementSibling?.focus(); }
          if (e.key === 'ArrowUp')   { e.preventDefault(); tr.previousElementSibling?.focus(); }
        };
      });
    }

    /* ---------- sorting ---------- */
    function wireSort() {
      document.querySelectorAll('th.sortable').forEach(th => {
        th.onclick = () => {
          const key = th.dataset.key;
          if (sortKey === key) sortDir = sortDir === 'asc' ? 'desc' : 'asc';
          else { sortKey = key; sortDir = key === 'priorityScore' || key === 'alertCount' ? 'desc' : 'asc'; }
          document.querySelectorAll('th.sortable').forEach(o => o.removeAttribute('aria-sort'));
          th.setAttribute('aria-sort', sortDir === 'asc' ? 'ascending' : 'descending');
          renderRows();
        };
      });
      document.querySelector('th[data-key="priorityScore"]').setAttribute('aria-sort', 'descending');
    }

    /* ---------- misc controls ---------- */
    document.getElementById('q').oninput = e => { query = e.target.value; renderRows(); };

    document.addEventListener('keydown', e => {
      if (e.key === '/' && document.activeElement.tagName !== 'INPUT') {
        e.preventDefault();
        document.getElementById('q').focus();
      }
    });

    document.querySelectorAll('[data-density]').forEach(btn => {
      btn.onclick = () => {
        document.querySelectorAll('[data-density]').forEach(b => b.setAttribute('aria-pressed', String(b === btn)));
        document.getElementById('table').classList.toggle('compact', btn.dataset.density === 'compact');
      };
    });

    document.getElementById('refreshBtn').onclick = async e => {
      const btn = e.currentTarget;
      btn.classList.add('is-loading');
      await load();
      btn.classList.remove('is-loading');
      toast('Queue refreshed');
    };

    /* ---------- load ---------- */
    async function load() {
      skeleton();
      data = await mockFetch(MOCK.queue, 520);
      renderMetrics(data.totals);
      renderBandFilter();
      renderRows();
      document.getElementById('stamp').textContent =
        'Updated ' + new Date().toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
    }

    wireSort();
    load();
  </script>
</body>
</html>
