<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sanctions Review — AML Alert Triage</title>
  <link rel="stylesheet" href="assets/theme.css" />
</head>
<body>
  <div id="shell"></div>

  <main class="canvas">
    <div class="page-head">
      <div>
        <div class="eyebrow"><span class="label-cap">Screening control</span></div>
        <h1>Sanctions Review</h1>
        <p>Potential list matches awaiting an analyst decision. A held payment cannot execute until it is resolved.</p>
      </div>
      <div class="page-head-actions">
        <span class="result-count" id="count"></span>
      </div>
    </div>

    <div class="cols" style="grid-template-columns:minmax(0,420px) minmax(0,1fr)">
      <div class="stack">
        <section class="card">
          <div class="card-head"><h2>Open potential matches</h2></div>
          <div id="hitList"></div>
        </section>
      </div>

      <!-- Populated by renderEmpty() / showHit() -->
      <div class="stack" id="detailWrap"></div>
    </div>
  </main>

  <div id="footer"></div>

  <script src="assets/ui.js"></script>
  <script src="assets/mock-data.js"></script>
  <script>
    mountShell({ active: 'queue', sub: 'Sanctions Review' },
      'The system does not determine guilt. It identifies unusual activity and provides investigators with explainable evidence.');

    // Restriction codes carried by the listing itself. Anything unmapped falls back to the
    // raw code with underscores stripped, so a new measure type never renders as blank.
    const MEASURE_LABELS = {
      asset_freeze: 'Asset freeze',
      travel_ban: 'Travel ban',
      arms_embargo: 'Arms embargo',
      transport_ban: 'Transport ban',
      trust_services: 'Trust services restriction'
    };
    const measureLabel = t => !t ? 'Unspecified measure'
      : (MEASURE_LABELS[t] || t.replace(/_/g, ' ').replace(/^./, c => c.toUpperCase()));

    let hits = [];
    let selected = null;

    function renderEmpty() {
      document.getElementById('detailWrap').innerHTML = `
        <div class="empty-state" style="min-height:300px">
          ${ico('scale')}
          <div class="t">Select a potential match</div>
          <div class="tiny">Pick a row on the left to compare the screened input against the listing.</div>
        </div>`;
    }

    function renderList() {
      document.getElementById('count').textContent = `${hits.length} open`;
      const host = document.getElementById('hitList');

      if (!hits.length) {
        host.innerHTML = `<div class="card-body"><div class="empty-state">
          ${ico('checkC')}<div class="t">No open potential matches</div>
          <div class="tiny">Everything screened has been resolved.</div></div></div>`;
        renderEmpty();
        return;
      }

      host.innerHTML = `<div class="table-wrap"><table class="data"><tbody>
        ${hits.map((h, i) => `
          <tr class="row-link stagger" data-id="${h.id}" tabindex="0"
              style="--band-color:var(--red-dot);animation-delay:${i * 40}ms">
            <td>
              <div class="cell-primary">${esc(h.screenedName)}</div>
              <div class="sub-line">${esc(h.triggerType)}${h.txnRef ? ' · ' + esc(h.txnRef) : ''}</div>
            </td>
            <td style="width:150px">
              <div class="sim-meter">
                <div class="bar"><span data-w="${Math.round(h.nameSimilarity * 100)}%"></span></div>
                <b>${h.nameSimilarity}</b>
              </div>
              <div class="sub-line">${esc(fmtShort(h.screenedAt))}</div>
            </td>
            <td class="right" style="width:40px"><span class="go">${ico('chevron')}</span></td>
          </tr>`).join('')}
      </tbody></table></div>`;

      paintBars(host);

      host.querySelectorAll('tr.row-link').forEach(tr => {
        const open = () => showHit(hits.find(h => String(h.id) === tr.dataset.id));
        tr.onclick = open;
        tr.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(); } };
      });
    }

    function showHit(h) {
      if (!h) return;
      selected = h;

      document.querySelectorAll('#hitList tr').forEach(tr =>
        tr.style.background = String(tr.dataset.id) === String(h.id) ? 'var(--surface-2)' : '');

      const md = h.matchDetailsSnapshot || {};
      const snap = h.sanctionsEntrySnapshot || {};
      const listed = Array.isArray(snap.measures) ? snap.measures : [];
      const aliases = Array.isArray(snap.aliases) ? snap.aliases : [];

      const compareRows = Object.keys(md).filter(k => k !== 'overall').map(k => {
        const v = md[k] || {};
        const result = v.match || (v.similarity != null ? v.similarity : '');
        return `<tr>
          <td>${esc(k.replace(/([A-Z])/g, ' $1').replace(/^./, c => c.toUpperCase()))}</td>
          <td>${v.input == null ? '<span class="muted-2">not provided</span>' : esc(v.input)}</td>
          <td>${v.listed == null ? '<span class="muted-2">—</span>' : esc(v.listed)}</td>
          <td class="match-${esc(v.match || '')}">${esc(result)}${
            v.similarity != null && v.match ? ` <span class="muted-2 num">(${v.similarity})</span>` : ''}</td>
        </tr>`;
      }).join('');

      document.getElementById('detailWrap').innerHTML = `
        <section class="card reveal">
          <div class="card-head">
            <div class="title-wrap">
              <h2>Match detail #${h.id}</h2>
              <span class="pill warn">POTENTIAL MATCH</span>
            </div>
            <span class="tiny muted-2 mono">${esc(snap.sourceUniqueId || '')}</span>
          </div>
          <div class="card-body stack" style="gap:1.15rem">

            <div>
              <div class="draft-block-head"><span class="label-cap">Overall name similarity</span></div>
              <div class="sim-meter" style="max-width:340px">
                <div class="bar"><span data-w="${Math.round(h.nameSimilarity * 100)}%"></span></div>
                <b>${h.nameSimilarity}</b>
              </div>
              <p class="tiny muted-2" style="margin-top:.3rem">
                A 0–1 string similarity, not an identity probability.</p>
            </div>

            <div>
              <div class="draft-block-head"><span class="label-cap">Screened input vs listing</span></div>
              <table class="compare">
                <thead><tr><th>Attribute</th><th>Input</th><th>Listed</th><th>Result</th></tr></thead>
                <tbody>${compareRows}</tbody>
              </table>
            </div>

            ${aliases.length ? `
            <div>
              <div class="draft-block-head"><span class="label-cap">Listed aliases</span></div>
              <div class="chip-row">${aliases.map(a =>
                `<span class="chip unverified">${esc(a)}</span>`).join('')}</div>
            </div>` : ''}

            <div>
              <div class="draft-block-head"><span class="label-cap">Listed measures</span></div>
              <dl class="kv wide">${listed.length
                ? listed.map(m => `<div>
                    <dt>${esc(measureLabel(m.type))}</dt>
                    <dd class="muted">${esc(m.source || '—')}</dd></div>`).join('')
                : '<div><dt class="muted">No measures recorded on this listing</dt><dd></dd></div>'}
              </dl>
              <details class="raw">
                <summary>${ico('chevron')} Raw listing snapshot</summary>
                <pre class="code">${esc(JSON.stringify(snap, null, 2))}</pre>
              </details>
            </div>

            <div class="field">
              <label>Outcome</label>
              <div class="choice-grid" style="grid-template-columns:1fr 1fr">
                <label class="choice">
                  <input type="radio" name="outcome" value="FALSE_MATCH" checked />
                  <span class="ct"><span class="dotmark"></span>False match</span>
                  <span class="cd">Not the listed person. The payment may proceed.</span>
                </label>
                <label class="choice">
                  <input type="radio" name="outcome" value="TARGET_MATCH" />
                  <span class="ct"><span class="dotmark"></span>Target match</span>
                  <span class="cd">Confirmed listing. The payment stays held.</span>
                </label>
              </div>
            </div>

            <div class="field">
              <label for="rationale">Resolution rationale <span class="muted-2">(required)</span></label>
              <textarea id="rationale" placeholder="Record what was checked and what it showed…"></textarea>
            </div>

            <div class="actions">
              <button class="btn" id="resolveBtn" type="button">${ico('check')} Resolve</button>
              <span class="hint" id="resolveMsg"></span>
            </div>
          </div>
        </section>`;

      paintBars(document.getElementById('detailWrap'));

      document.getElementById('resolveBtn').onclick = async e => {
        const btn = e.currentTarget;
        const ta = document.getElementById('rationale');
        if (!ta.value.trim()) {
          document.getElementById('resolveMsg').innerHTML =
            '<span style="color:var(--red-fg);font-weight:600">Rationale is required.</span>';
          ta.focus();
          return;
        }
        btn.classList.add('is-loading'); btn.disabled = true;
        await mockFetch(null, 700);
        const outcome = document.querySelector('input[name="outcome"]:checked').value;
        hits = hits.filter(x => x.id !== selected.id);
        selected = null;
        renderList();
        renderEmpty();
        toast(`Hit resolved — ${outcome === 'FALSE_MATCH' ? 'false match' : 'target match'}`);
      };
    }

    (async function load() {
      document.getElementById('hitList').innerHTML =
        `<div class="card-body">${Array.from({ length: 3 }, () =>
          '<div class="sk" style="height:44px;margin-bottom:.5rem"></div>').join('')}</div>`;
      renderEmpty();

      hits = (await mockFetch(MOCK.hits, 420)).filter(h => h.triggerType !== 'LIST_UPDATE_RESCREEN');
      renderList();

      // Arriving from a payment that was just held: open that hit instead of a list to search.
      const wanted = Number(new URLSearchParams(location.search).get('hitId'));
      const target = wanted ? hits.find(h => h.id === wanted) : null;
      if (target) showHit(target);
    })();
  </script>
</body>
</html>
