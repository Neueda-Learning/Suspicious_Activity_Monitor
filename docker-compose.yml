services:
  postgres:
    image: postgres:16-alpine
    container_name: aml-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: aml
      POSTGRES_USER: aml
      POSTGRES_PASSWORD: aml
    volumes:
      - aml_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aml -d aml"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  aml_pgdata:
