services:
  postgres:
    image: postgres:16-alpine
    container_name: aml-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: aml
      POSTGRES_USER: aml
      POSTGRES_PASSWORD: aml
    volumes:
      - aml_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aml -d aml"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: aml-app
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: demo
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/aml
      SPRING_DATASOURCE_USERNAME: aml
      SPRING_DATASOURCE_PASSWORD: aml
      # Ollama runs on the developer machine; localhost inside this container would
      # point back to the application container itself.
      AML_OLLAMA_BASE_URL: http://host.docker.internal:11434
      AML_OLLAMA_MODEL: qwen3:4b
      AML_OLLAMA_TIMEOUT_MS: 60000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  aml_pgdata:
