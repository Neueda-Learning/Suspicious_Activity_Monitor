<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AML Alert Triage — Case Queue</title>
  <link rel="stylesheet" href="/css/app.css?v=2" />
</head>
<body>
  <header class="topbar">
    <div class="brand">AML Alert Triage <span>UK · GBP · Corporate</span></div>
    <nav class="nav">
      <a class="active" href="/">Case Queue</a>
      <a href="/demo.html">Live Demo</a>
      <span class="nav-spacer" aria-hidden="true"></span>
    </nav>
  </header>
  <main class="wrap">
    <div class="totals" id="totals"></div>
    <section class="panel">
      <h2>Open cases <span class="muted" style="font-weight:500">(sorted by priority)</span></h2>
      <table>
        <thead>
          <tr>
            <th>Case</th><th>Customer</th><th>Band</th><th>Score</th><th>Alerts</th><th>SLA Deadline</th><th>Assignee</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </section>
  </main>

  <footer class="footer">The system does not determine guilt. It identifies unusual activity and provides investigators with explainable evidence.</footer>
  <script src="/js/api.js?v=2"></script>
  <script>
    async function load() {
      const data = await api('/api/cases?status=OPEN&sort=priority');
      const t = data.totals;
      document.getElementById('totals').innerHTML = `
        <div class="total"><div class="label">Alerts</div><div class="value">${t.alerts}</div></div>
        <div class="total"><div class="label">Open cases</div><div class="value">${t.cases}</div></div>
        <div class="total"><div class="label">Assigned to me</div><div class="value">${t.assignedToMe}</div></div>
        <div class="total"><div class="label">Overdue</div><div class="value">${t.overdue}</div></div>`;
      document.getElementById('rows').innerHTML = data.items.map(c => `
        <tr onclick="location.href='/case.html?id=${c.id}'">
          <td class="mono">${c.caseRef}${c.overdue ? ' <span class="badge warn">OVERDUE</span>' : ''}</td>
          <td>${c.customerName || ''} <div class="muted mono">${c.customerRef || ''}</div></td>
          <td><span class="band ${c.priorityBand}">${bandLabel(c.priorityBand)}</span></td>
          <td><strong>${c.priorityScore}</strong></td>
          <td>${c.alertCount}</td>
          <td>${fmtTs(c.slaDueAt)}</td>
          <td>${c.assignedTo || '—'}</td>
        </tr>`).join('');
    }
    load().catch(e => showPageError(e.message));
  </script>
</body>
</html>
